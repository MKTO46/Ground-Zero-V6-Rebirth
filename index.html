<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>GROUND ZERO</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#f9f9f9;font-family:system-ui,-apple-system,Arial,sans-serif}body{min-height:100dvh}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid white;outline-offset:5px}#stars{position:fixed;inset:0;z-index:0;pointer-events:none}.haze{position:fixed;inset:-20%;background:radial-gradient(ellipse at 15% 20%,#bbb1,transparent 38%),radial-gradient(ellipse at 85% 75%,#eee1,transparent 34%);pointer-events:none}.cross{position:fixed;top:6vh;left:50%;transform:translateX(-50%);height:42px;width:28px;z-index:2;pointer-events:none;filter:drop-shadow(0 0 10px #fff9);animation:float 4s ease-in-out infinite}.cross line{stroke:white;stroke-width:2.2;stroke-linecap:round}@keyframes float{50%{transform:translate(-50%,-9px)}}main{position:relative;z-index:1;max-width:520px;min-height:100dvh;padding:90px 24px 40px;margin:auto;display:flex;justify-content:center;align-items:center;text-align:center}.screen{width:100%;animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.title{font-weight:500;font-size:clamp(29px,7vw,44px);line-height:1.2;margin:0 0 32px}.letters{word-break:normal;overflow-wrap:normal}.letters .word{display:inline-block;white-space:nowrap}.letters .letter{display:inline-block;white-space:pre;opacity:0;filter:blur(10px);animation:materialize .6s forwards}@keyframes materialize{to{opacity:1;filter:blur(0)}}.tag{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#aaa;margin:0 0 17px}.day{font-size:clamp(52px,12vw,78px);font-weight:280;letter-spacing:-.06em;margin:9px 0 15px}.time{font-size:17px;letter-spacing:.11em;color:#ddd;margin-bottom:28px;font-variant-numeric:tabular-nums}.exercise{font-size:clamp(27px,7vw,39px);font-weight:570;line-height:1.2;margin:0 0 19px}.sets{font-size:17px;margin:10px 0 18px;color:#ddd}.detail{color:#aaa;font-size:14px;line-height:1.6;margin:12px auto 26px;max-width:390px}.big{width:100%;border:1px solid #fff;background:#f9f9f9;color:#090909;padding:19px 14px;min-height:70px;border-radius:13px;font-weight:750;font-size:18px}.big:active{transform:scale(.98)}.secondary{background:#151515;color:#fff;border-color:#777}.timer{font-size:clamp(60px,18vw,90px);font-weight:300;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:8px 0 29px}.foot{color:#888;font-size:12px;margin:17px 0}.progress{height:2px;background:#555;width:100%;margin:17px 0 25px}.progress>div{height:100%;background:white;transition:width .2s}@media(prefers-reduced-motion:reduce){.screen,.cross,.letters span{animation:none!important;opacity:1!important;filter:none!important}}
</style></head><body><canvas id="stars" aria-hidden="true"></canvas><div class="haze"></div><svg class="cross" viewBox="0 0 28 42" aria-hidden="true"><line x1="14" y1="2" x2="14" y2="40"/><line x1="3" y1="14" x2="25" y2="14"/></svg><main id="main" aria-live="polite"></main>
<script>
'use strict';
const KEY='groundZeroSimple2026', REST=180000, localDay=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const clock=()=>new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const seconds=n=>String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')+':'+String(Math.max(0,n)%60).padStart(2,'0');
const mk=(name,category,sets,detail,run=false)=>({name,category,sets,detail,run});
const mob=()=>mk('Seated leg lifts','MOBILITY · LADDER A',2,'5 controlled lifts per leg · current stage');
const core=()=>mk('Front plank','CORE · LADDER D',3,'Your current plank progression stage');
const gym=()=>[mk('Assisted pull-ups','GYM',3,'135 lb assistance · follow your current rep target'),mk('Assisted dips','GYM',3,'135 lb assistance · follow your current rep target')];
const tasks=()=>[mob(),...(new Date().getDay()===0?[]:gym()),core(),mk('Go to running app','OUTDOOR RUN',1,'Warm up 5 min · 20 × (30-sec run + 5-min walk) · Cool down 5 min',true),core(),...(new Date().getDay()===0?[]:gym()),mob()];
let data;try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{data={}}
data={day:1,index:0,set:1,view:'welcome',restUntil:0,runStarted:0,finishedDate:'',...data};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}};
const main=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
function appear(s){let i=0;return String(s).split(/(\s+)/).map(part=>/^\s+$/.test(part)?' ': '<span class="word">'+Array.from(part).map(c=>'<span class="letter" style="animation-delay:'+Math.min(i++*34,2700)+'ms">'+esc(c)+'</span>').join('')+'</span>').join('')}
function show(x){main.innerHTML='<section class="screen">'+x+'</section>'}
function day(){return String(data.day).padStart(2,'0')+' / 14 DAYS'}
function sync(){if(data.view==='locked'&&data.finishedDate&&data.finishedDate!==localDay()&&data.day<14){data.day++;data.index=0;data.set=1;data.view='welcome';data.restUntil=0;data.runStarted=0;data.finishedDate='';save()}}
function button(label,fn,secondary=false){return '<button class="big'+(secondary?' secondary':'')+'" onclick="'+fn+'()">'+label+'</button>'}
function advance(){data.index++;data.set=1;if(data.index>=tasks().length){data.view='locked';data.finishedDate=localDay()}else{data.view=tasks()[data.index].run?'run':'task'}save();render()}
function begin(){data.view='ready';save();render()}
function start(){data.view=tasks()[data.index].run?'run':'task';save();render()}
function yes(){const t=tasks()[data.index];if(data.set<t.set){data.set++;data.restUntil=Date.now()+REST;data.view='rest';save();render()}else advance()}
function startRun(){if(!data.runStarted)data.runStarted=Date.now();save();render()}
function stopRun(){data.runStarted=0;advance()}
function nextDay(){sync();render()}
function render(){
 sync();
 if(data.view==='rest'&&Date.now()>=data.restUntil){data.view='task';data.restUntil=0;save()}
 if(data.view==='welcome'){show('<p class="tag">GROUND ZERO · WOLF-01</p><h1 class="title letters">'+appear('Welcome to Ground Zero.')+'</h1><p class="title letters">'+appear('Are you ready to enter?')+'</p>'+button('ENTER','begin')+'<p class="foot">DAY '+data.day+' OF 14</p>');return}
 if(data.view==='ready'){show('<div class="tag">'+day()+'</div><h1 class="title letters">'+appear('Are you ready to work out?')+'</h1>'+button('YES','start'));return}
 if(data.view==='locked'){const final=data.day>=14;show('<div class="tag">'+day()+'</div><h1 class="title letters">'+appear(final?'14 days complete.':'Workout complete. Come back tomorrow.')+'</h1><div class="time">'+clock()+'</div><p class="detail">'+(final?'Your 14-day block is complete.':'Next workout unlocks after 12:00 AM local time.')+'</p>'+(final?'<p class="foot">GROUND ZERO</p>':button('CHECK AGAIN','nextDay',true)));return}
 const t=tasks()[data.index]||tasks()[0],count='<div class="tag">'+day()+'</div><div class="time">'+clock()+'</div>';
 if(data.view==='run'){show(count+'<p class="tag">OUTDOOR RUN</p><h1 class="title letters">'+appear('Go to running app.')+'</h1><p class="detail">'+esc(t.detail)+'</p>'+(data.runStarted?'<div class="timer">'+seconds(Math.floor((Date.now()-data.runStarted)/1000))+'</div>'+button('STOP RUN','stopRun'):'<h2 class="exercise letters">'+appear('Is your run complete?')+'</h2>'+button('START RUN','startRun')+'<p class="foot">Open your running app, then return here to finish.</p>'));return}
 if(data.view==='rest'){show(count+'<p class="tag">REST BETWEEN SETS</p><h1 class="title letters">'+appear('Next set begins automatically.')+'</h1><div class="timer">'+seconds(Math.ceil((data.restUntil-Date.now())/1000))+'</div><p class="detail">Three-minute recovery</p>');return}
 show(count+'<p class="tag">'+esc(t.category)+'</p><h1 class="exercise letters">'+appear(t.name)+'</h1><p class="sets">SET '+data.set+' / '+t.set+'</p><p class="detail">'+esc(t.detail)+'</p>'+button('YES — SET COMPLETED','yes')+'<div class="progress"><div style="width:'+Math.round((data.index+data.set/t.set)/tasks().length*100)+'%"></div></div><p class="foot">One set at a time.</p>')
}
setInterval(()=>{if(data.view==='rest'||data.view==='locked'||data.view==='run')render();else{const el=document.querySelector('.time');if(el)el.textContent=clock()}},1000);
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');let stars=[],w,h;
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;stars=Array.from({length:Math.min(95,Math.ceil(w*h/12500))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*1.4+.35}))}
addEventListener('resize',resize);resize();
function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='white';for(const s of stars){s.x+=s.vx;s.y+=s.vy;if(s.x<0||s.x>w)s.vx*=-1;if(s.y<0||s.y>h)s.vy*=-1;ctx.globalAlpha=.25+s.r/2.8;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}if(!matchMedia('(prefers-reduced-motion: reduce)').matches)draw();else{ctx.fillStyle='white';for(const s of stars)ctx.fillRect(s.x,s.y,1,1)}
</script></body></html>
